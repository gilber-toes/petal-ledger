<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petal Ledger</title>
<meta name="description" content="Log daily spending, set a daily budget and see weekly, monthly and yearly reports.">
<meta name="theme-color" content="#f6f2ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petal Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a phone-width app shell — header, one scrolling view, floating "+" button and a bottom tab bar; sheets slide up for editing. */
:root {
  --h: 265;                                   /* theme hue, set from Settings */
  --bg: hsl(var(--h) 70% 97%);
  --surface: #ffffff;
  --surface-2: hsl(var(--h) 60% 95%);
  --ink: hsl(var(--h) 28% 22%);
  --muted: hsl(var(--h) 12% 47%);
  --line: hsl(var(--h) 40% 90%);
  --accent: hsl(var(--h) 70% 72%);
  --accent-strong: hsl(var(--h) 42% 44%);
  --accent-soft: hsl(var(--h) 85% 93%);
  --on-accent: hsl(var(--h) 45% 16%);
  --mint-bg: hsl(155 60% 90%);
  --mint-bar: hsl(155 48% 70%);
  --mint-ink: hsl(155 55% 28%);
  --rose-bg: hsl(345 90% 93%);
  --rose-bar: hsl(345 75% 78%);
  --rose-ink: hsl(345 55% 42%);
  --cat-s: 80%; --cat-l: 90%;
  /* buddy character (same in both themes; the shirt follows the theme hue) */
  --m-skin: #ffdcc6; --m-skin-2: #f2c3a6; --m-shave: #a99aae; --m-hair: #3b2b40; --m-line: #3b2b40;
  --m-shirt: hsl(var(--h) 72% 80%); --m-shirt-2: hsl(var(--h) 45% 62%); --m-print: #ffffff;
  --m-heart: #ff7c9c; --m-blush: #ffb0c2; --m-sweat: #9fd8ff; --m-spark: #ffcf4d;
  --m-hair-soft: #313036; --m-hair-deep: #24232a; --m-hair-hi: #46454d; --m-hair-line: #17161b;
  --m-eye: #4a3226; --m-mouth: #b9776a; --m-blush-soft: #f3b9b6;
  --shadow: 0 6px 24px hsl(var(--h) 40% 50% / 0.10);
  --font-display: "Fredoka", "Avenir Next Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Nunito", "Avenir Next", system-ui, -apple-system, sans-serif;
  --r: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: hsl(var(--h) 22% 11%); --surface: hsl(var(--h) 20% 15%); --surface-2: hsl(var(--h) 20% 19%);
    --ink: hsl(var(--h) 35% 94%); --muted: hsl(var(--h) 14% 70%); --line: hsl(var(--h) 18% 25%);
    --accent: hsl(var(--h) 70% 76%); --accent-strong: hsl(var(--h) 80% 82%); --accent-soft: hsl(var(--h) 28% 27%);
    --on-accent: hsl(var(--h) 45% 14%);
    --mint-bg: hsl(155 25% 23%); --mint-bar: hsl(155 40% 55%); --mint-ink: hsl(155 60% 78%);
    --rose-bg: hsl(345 25% 25%); --rose-bar: hsl(345 60% 66%); --rose-ink: hsl(345 85% 84%);
    --cat-s: 30%; --cat-l: 30%; --shadow: 0 6px 24px rgb(0 0 0 / 0.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: hsl(var(--h) 22% 11%); --surface: hsl(var(--h) 20% 15%); --surface-2: hsl(var(--h) 20% 19%);
  --ink: hsl(var(--h) 35% 94%); --muted: hsl(var(--h) 14% 70%); --line: hsl(var(--h) 18% 25%);
  --accent: hsl(var(--h) 70% 76%); --accent-strong: hsl(var(--h) 80% 82%); --accent-soft: hsl(var(--h) 28% 27%);
  --on-accent: hsl(var(--h) 45% 14%);
  --mint-bg: hsl(155 25% 23%); --mint-bar: hsl(155 40% 55%); --mint-ink: hsl(155 60% 78%);
  --rose-bg: hsl(345 25% 25%); --rose-bar: hsl(345 60% 66%); --rose-ink: hsl(345 85% 84%);
  --cat-s: 30%; --cat-l: 30%; --shadow: 0 6px 24px rgb(0 0 0 / 0.3); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.45;
  background-image: radial-gradient(60rem 30rem at 110% -10%, hsl(calc(var(--h) + 40) 80% 92% / 0.55), transparent 60%),
                    radial-gradient(50rem 30rem at -20% 0%, hsl(calc(var(--h) - 60) 80% 92% / 0.45), transparent 60%);
  background-attachment: fixed;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background-image: none; } }
:root[data-theme="dark"] body { background-image: none; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; font-weight: 600; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent-strong); outline-offset: 2px; }
.num, .amt { font-variant-numeric: tabular-nums; }

.app { max-width: 520px; margin: 0 auto; padding-block: 14px 130px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 38px; height: 38px; border-radius: 13px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); box-shadow: var(--shadow); flex: none; }
.eyebrow { margin: 0; font-size: 0.76rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: 1.55rem; line-height: 1.1; }
.status { font-size: 0.75rem; color: var(--muted); text-align: right; max-width: 48%; }
.status.warn { color: var(--rose-ink); }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: hsl(48 95% 88%); color: hsl(35 50% 25%); border-radius: 16px; padding: 10px 14px; font-size: 0.88rem; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .banner { background: hsl(45 30% 24%); color: hsl(45 80% 85%); } }
:root[data-theme="dark"] .banner { background: hsl(45 30% 24%); color: hsl(45 80% 85%); }
.banner button { border: 0; background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 0.82rem; }

.view { display: grid; gap: 14px; }
.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.card-head h2 { font-size: 1.08rem; }
.sub { color: var(--muted); font-size: 0.85rem; }
.lbl { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.empty { color: var(--muted); font-size: 0.9rem; margin: 6px 0; text-align: center; padding: 14px 6px; }

/* day navigation */
.day-nav { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); font-size: 1.3rem; display: grid; place-items: center; color: var(--accent-strong); }
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.day-pill { position: relative; height: 44px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; cursor: pointer; overflow: hidden; }
.day-pill svg { color: var(--accent-strong); }
.day-pill input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; }

/* hero ring */
.hero { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: center; }
@media (max-width: 360px) { .hero { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; } }
.ring-wrap { position: relative; width: 150px; height: 150px; }
.ring { width: 100%; height: 100%; }
.ring-track { fill: none; stroke: var(--surface-2); stroke-width: 14; }
.ring-arc { fill: none; stroke: var(--mint-bar); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease, stroke 0.3s; }
.ring-arc.over { stroke: var(--rose-bar); }
.ring-arc.idle { stroke: var(--accent); }
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 18px; }
.ring-amt { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; line-height: 1.1; overflow-wrap: anywhere; }
.ring-amt.good { color: var(--mint-ink); } .ring-amt.bad { color: var(--rose-ink); }
.ring-sub { font-size: 0.78rem; color: var(--muted); font-weight: 700; }
.hero-stats { display: grid; gap: 10px; min-width: 0; }
.stat-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.stat-line b { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px; font-size: 0.8rem; font-weight: 700; border: 0; }
.chip.soft { background: var(--accent-soft); color: var(--accent-strong); }
.chip.good { background: var(--mint-bg); color: var(--mint-ink); }
.chip.bad { background: var(--rose-bg); color: var(--rose-ink); }
.chip.btn { cursor: pointer; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.streak { margin-top: 12px; padding-top: 12px; border-top: 1.5px dashed var(--line); display: flex; justify-content: space-between; gap: 10px; font-size: 0.88rem; }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wday { border: 0; background: var(--surface); border-radius: 16px; padding: 8px 0 7px; display: grid; justify-items: center; gap: 2px; box-shadow: var(--shadow); min-width: 0; }
.wday .w { font-size: 0.68rem; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.wday .d { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.wday .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.wday .dot.good { background: var(--mint-bar); } .wday .dot.bad { background: var(--rose-bar); }
.wday .dot.ns { background: var(--mint-ink); box-shadow: 0 0 0 2px var(--mint-bg); }
.wday .dot.miss { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
.ns-badge { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--mint-bar); color: var(--mint-ink); font-weight: 800; flex: none; }
.nospend-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; border: 2px dashed var(--mint-bar); background: var(--mint-bg); color: var(--mint-ink); border-radius: 18px; padding: 12px 14px; font-weight: 800; }
.nospend-card { display: flex; gap: 12px; align-items: center; background: var(--mint-bg); border-radius: 18px; padding: 14px; }
.nospend-card b { color: var(--mint-ink); }
.ns-strip { display: flex; flex-wrap: wrap; gap: 8px; }
.col.ns::after { content: ""; position: absolute; bottom: 5px; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--mint-ink); }
.wday.sel { background: var(--accent); color: var(--on-accent); }
.wday.sel .w { color: var(--on-accent); }
.wday.today:not(.sel) .d { color: var(--accent-strong); }

/* log rows */
.logs { display: grid; }
.log { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 4px; border: 0; background: none; text-align: left; border-radius: 14px; width: 100%; }
.log:hover { background: var(--surface-2); }
.bub { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 1.25rem; background: hsl(var(--ch) var(--cat-s) var(--cat-l)); flex: none; }
.log-main { display: grid; min-width: 0; }
.log-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-note { color: var(--muted); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-amt { text-align: right; font-weight: 800; display: grid; }
.log-amt small { font-weight: 600; color: var(--muted); font-size: 0.76rem; }
.ex { font-size: 0.62rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; background: hsl(48 95% 85%); color: hsl(35 55% 28%); border-radius: 6px; padding: 1px 5px; margin-left: 6px; vertical-align: 2px; }
.day-group + .day-group { margin-top: 6px; }
.day-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 4px 4px; font-weight: 800; font-size: 0.85rem; color: var(--muted); }

/* reports */
.seg { display: flex; background: var(--surface); border-radius: 999px; padding: 4px; gap: 4px; box-shadow: var(--shadow); }
.seg button { flex: 1; border: 0; background: none; border-radius: 999px; padding: 8px 0; font-weight: 800; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.pnav { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; text-align: center; }
.pnav .plabel { font-family: var(--font-display); font-weight: 600; font-size: 1.08rem; }
.pnav .plabel button { border: 0; background: none; color: var(--accent-strong); font-size: 0.78rem; font-weight: 800; display: block; margin: 0 auto; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; gap: 2px; min-width: 0; }
.kpi .v { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; overflow-wrap: anywhere; }
.kpi .hint { font-size: 0.78rem; color: var(--muted); }
.kpi.good { background: var(--mint-bg); } .kpi.good .v { color: var(--mint-ink); }
.kpi.bad { background: var(--rose-bg); } .kpi.bad .v { color: var(--rose-ink); }
.up { color: var(--rose-ink); font-weight: 800; } .down { color: var(--mint-ink); font-weight: 800; }

.chart { position: relative; height: 160px; display: flex; align-items: flex-end; gap: 3px; padding-top: 18px; border-bottom: 1.5px solid var(--line); }
.gl { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); pointer-events: none; }
.gl span { position: absolute; right: 0; top: -15px; font-size: 0.66rem; font-weight: 700; color: var(--muted); background: var(--surface); padding-left: 4px; }
.col { flex: 1; min-width: 0; height: 100%; position: relative; display: flex; flex-direction: column; justify-content: flex-end; }
.col .b { border-radius: 7px 7px 3px 3px; background: var(--accent-soft); }
.col.good .b { background: var(--mint-bar); } .col.bad .b { background: var(--rose-bar); }
.col.zero .b { height: 3px !important; background: var(--line); }
.col .mk { position: absolute; left: -1px; right: -1px; border-top: 2px dotted var(--accent-strong); opacity: 0.7; pointer-events: none; }
.col .tip { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); font-size: 0.72rem; font-weight: 700; padding: 4px 8px; border-radius: 8px; white-space: nowrap; pointer-events: none; opacity: 0; z-index: 3; }
.col:first-child .tip, .col:nth-child(2) .tip { left: 0; transform: none; }
.col:last-child .tip, .col:nth-last-child(2) .tip { left: auto; right: 0; transform: none; }
.col:hover .tip, .col:focus .tip { opacity: 1; }
.xl { display: flex; gap: 3px; margin-top: 4px; }
.xl span { flex: 1; min-width: 0; text-align: center; font-size: 0.66rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.76rem; color: var(--muted); font-weight: 700; margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend i.dash { height: 0; border-top: 2px dotted var(--accent-strong); border-radius: 0; width: 14px; vertical-align: 3px; }

.catrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 5px 0; }
.catrow .bub { width: 34px; height: 34px; border-radius: 11px; font-size: 1rem; grid-row: span 2; }
.catrow .nm { font-weight: 700; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.catrow .amt { font-weight: 800; font-size: 0.92rem; text-align: right; }
.catrow .amt small { color: var(--muted); font-weight: 700; margin-left: 4px; }
.track { grid-column: 2 / -1; height: 7px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.track span { display: block; height: 100%; border-radius: 999px; background: hsl(var(--ch) 65% 72%); }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
.drow:last-child { border-bottom: 0; }
.drow .amt { text-align: right; color: var(--muted); }
.ghost { border: 0; background: var(--accent-soft); color: var(--accent-strong); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 0.85rem; }

/* logs view */
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 11px 16px; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 0; background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 0.84rem; box-shadow: var(--shadow); }
.fchip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* settings */
.set-group { display: grid; gap: 12px; }
.field { display: grid; gap: 5px; }
.field > span { font-size: 0.8rem; font-weight: 800; color: var(--muted); }
.input, .field input, .field select { width: 100%; min-width: 0; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 10px 12px; }
.input:focus, .field input:focus, .field select:focus { border-color: var(--accent); outline: none; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.themes { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 46px; height: 46px; border-radius: 16px; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); background: hsl(var(--sh) 75% 80%); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent-strong); }
.rate-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-weight: 700; font-size: 0.9rem; }
.rate-row input { width: 100%; min-width: 0; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 7px 10px; }
.x { border: 0; background: none; color: var(--muted); font-size: 1.1rem; width: 32px; height: 32px; border-radius: 50%; }
.x:hover { background: var(--surface-2); }
.add-rate { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1fr) auto; gap: 8px; }
.cat-item { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 0; }
.cat-item .nm { font-weight: 700; }
.inline-note { font-size: 0.82rem; color: var(--muted); margin: 0; }
.inline-warn { background: var(--rose-bg); color: var(--rose-ink); border-radius: 14px; padding: 10px 12px; font-size: 0.86rem; display: grid; gap: 8px; }

/* floating button + tab bar */
.fab { position: fixed; z-index: 20; right: max(18px, calc(50% - 260px + 18px)); right: max(calc(18px + env(safe-area-inset-right, 0px)), calc(50% - 242px)); bottom: calc(82px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; border-radius: 22px; border: 0; background: var(--accent); color: var(--on-accent); box-shadow: 0 10px 26px hsl(var(--h) 60% 50% / 0.35); display: grid; place-items: center; transition: transform 0.15s; }
.fab:active { transform: scale(0.94); }
.tabbar { position: fixed; z-index: 15; left: 0; right: 0; bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.tabbar-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { border: 0; background: none; padding: 9px 0 10px; display: grid; justify-items: center; gap: 3px; font-size: 0.72rem; font-weight: 800; color: var(--muted); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent-strong); }
.tab[aria-current="page"] .ic { background: var(--accent-soft); }

/* sheets */
.scrim { position: fixed; inset: 0; z-index: 30; background: hsl(var(--h) 30% 15% / 0.35); }

.hue[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent-strong); }
.emoji-in { font-size: 1.6rem; text-align: center; width: 64px !important; }
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 0.88rem; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }

/* buddy */
.hang { position: relative; display: grid; }
.hang > .card { position: relative; z-index: 1; }
.buddy-zone { position: relative; z-index: 2; display: flex; align-items: flex-end; justify-content: flex-end; gap: 6px; margin-bottom: -8px; padding-right: 8px; pointer-events: none; }
.bubble { pointer-events: auto; position: relative; flex: 0 1 300px; min-width: 0; background: var(--surface); border-radius: 18px 18px 6px 18px; padding: 9px 13px 10px; box-shadow: var(--shadow); font-size: 0.88rem; line-height: 1.35; margin-bottom: 44px; cursor: pointer; }

.buddy-btn { pointer-events: auto; flex: none; width: 104px; height: 104px; border: 0; background: none; padding: 0; transform-origin: 50% 100%; animation: sway 5s ease-in-out infinite; }
.buddy-btn svg { width: 100%; height: 100%; overflow: visible; display: block; }

@keyframes sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px) rotate(-3deg); } 75% { transform: translateX(4px) rotate(3deg); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } 55% { transform: translateY(0); } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const clone = o => JSON.parse(JSON.stringify(o));

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, "0");
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const todayKey = () => keyOf(new Date());
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const shiftKey = (k, n) => keyOf(addDays(parseKey(k), n));
  const fmtD = (d, o) => new Intl.DateTimeFormat(undefined, o).format(typeof d === "string" ? parseKey(d) : d);
  const validKey = k => /^\d{4}-\d{2}-\d{2}$/.test(k || "");

  // ---------- constants ----------
  const CURRENCIES = ["USD","EUR","GBP","JPY","CNY","KRW","INR","PHP","SGD","HKD","TWD","IDR","MYR","THB","VND","AUD","NZD","CAD","MXN","BRL","ZAR","NGN","AED","SAR","CHF","SEK","NOK","DKK","PLN","TRY"];
  const HUES = [350, 12, 28, 45, 70, 100, 140, 165, 185, 205, 225, 250, 270, 295, 320];
  const THEMES = [["Lavender", 265], ["Mint", 158], ["Peach", 22], ["Sky", 205], ["Rose", 340], ["Butter", 45]];
  const DEFAULT_CATS = [
    { id: "food", name: "Food", emoji: "🍜", hue: 28 },
    { id: "groceries", name: "Groceries", emoji: "🥕", hue: 100 },
    { id: "coffee", name: "Coffee & snacks", emoji: "☕", hue: 45 },
    { id: "transport", name: "Transport", emoji: "🚌", hue: 205 },
    { id: "home", name: "Rent & home", emoji: "🏠", hue: 270 },
    { id: "bills", name: "Bills", emoji: "💡", hue: 70 },
    { id: "shopping", name: "Shopping", emoji: "🛍️", hue: 320 },
    { id: "health", name: "Health", emoji: "💊", hue: 165 },
    { id: "fun", name: "Fun", emoji: "🎬", hue: 295 },
    { id: "subs", name: "Subscriptions", emoji: "📺", hue: 225 },
    { id: "gifts", name: "Gifts", emoji: "🎁", hue: 350 },
    { id: "other", name: "Other", emoji: "✨", hue: 185 },
  ];
  const DEFAULTS = { currency: "USD", dailyBudgetCents: 0, dayBudgets: {}, noSpend: {}, buddy: { on: true, name: "Gus" }, categories: DEFAULT_CATS, rates: {}, weekStart: 1, startDate: "", theme: 265 };
  let S = clone(DEFAULTS);

  const st = {
    months: {}, view: "today", day: todayKey(),
    period: "week", anchor: todayKey(),
    logsMonth: todayKey().slice(0, 7), logsCat: "all", logsQuery: "",
    edit: null, formCat: null, lastCur: null, catEdit: null, catHue: 205, catFromLog: false, budgetDay: null,
    pendingCur: null,
  };
  const pending = {}; let pendingSettings = 0;
  let db = null, downloads = null, readOnly = false;

  // ---------- money ----------
  const nfCache = {};
  function nf(cur) {
    if (!nfCache[cur]) { try { nfCache[cur] = new Intl.NumberFormat(undefined, { style: "currency", currency: cur }); } catch { nfCache[cur] = new Intl.NumberFormat(undefined, { style: "currency", currency: "USD" }); } }
    return nfCache[cur];
  }
  const money = (c, cur = S.currency) => nf(cur).format((c || 0) / 100);
  function moneyShort(c) { try { return new Intl.NumberFormat(undefined, { style: "currency", currency: S.currency, notation: "compact", maximumFractionDigits: 1 }).format(c / 100); } catch { return money(c); } }
  function parseNum(str) {
    const s = String(str ?? "").trim().replace(/[^\d.,]/g, "").replace(/,(?=\d{3}(\D|$))/g, "").replace(",", ".");
    const v = parseFloat(s); return Number.isFinite(v) ? v : NaN;
  }
  const tidyRate = v => +Number(v).toPrecision(6);

  // ---------- data helpers ----------
  const allEntries = () => Object.values(st.months).flat().filter(e => e && e.kind !== "income" && validKey(e.date));
  function homeCents(e) {
    const h = S.currency, cur = e.cur || e.home || h, eh = e.home || h;
    if (cur === h) return e.amt ?? e.cents;
    if (eh === h) return e.cents;
    if (S.rates[eh]) return Math.round(e.cents * S.rates[eh]);
    if (S.rates[cur]) return Math.round((e.amt ?? e.cents) * S.rates[cur]);
    return e.cents;
  }
  const activeCats = () => S.categories.filter(c => !c.archived);
  const catOf = id => S.categories.find(c => c.id === id) || { id, name: "Uncategorized", emoji: "•", hue: 250 };
  const dayBudget = k => Object.prototype.hasOwnProperty.call(S.dayBudgets, k) ? S.dayBudgets[k] : S.dailyBudgetCents;
  function context() {
    const all = allEntries(), byDay = {};
    let first = null;
    for (const e of all) { byDay[e.date] = (byDay[e.date] || 0) + homeCents(e); if (!first || e.date < first) first = e.date; }
    for (const k of Object.keys(S.noSpend)) if (!first || k < first) first = k;
    const today = todayKey();
    return { all, byDay, today, start: S.startDate || first || today };
  }
  const isNoSpend = k => !!S.noSpend[k];
  // a day counts toward budget totals once it has logs or is marked as a no-spend day
  const logged = (k, c) => (c.byDay[k] || 0) > 0 || isNoSpend(k);
  const counted = (k, c) => k >= c.start && k <= c.today && logged(k, c);
  const missed = (k, c) => k >= c.start && k < c.today && !logged(k, c);
  function setNoSpend(k, on) {
    if (on) S.noSpend[k] = true; else delete S.noSpend[k];
    saveSettings(); render();
    toast(on ? "Marked as a no-spend day" : "No-spend mark removed");
  }
  function weekStartOf(k) { const d = parseKey(k); return addDays(d, -((d.getDay() - S.weekStart + 7) % 7)); }
  function range(period, k) {
    const a = parseKey(k); let s, e;
    if (period === "week") { s = weekStartOf(k); e = addDays(s, 7); }
    else if (period === "month") { s = new Date(a.getFullYear(), a.getMonth(), 1); e = new Date(a.getFullYear(), a.getMonth() + 1, 1); }
    else { s = new Date(a.getFullYear(), 0, 1); e = new Date(a.getFullYear() + 1, 0, 1); }
    return { s, e, sk: keyOf(s), ek: keyOf(e) };
  }
  function shiftPeriod(period, k, dir) {
    const a = parseKey(k);
    if (period === "week") return keyOf(addDays(a, 7 * dir));
    if (period === "month") return keyOf(new Date(a.getFullYear(), a.getMonth() + dir, 1));
    return keyOf(new Date(a.getFullYear() + dir, 0, 1));
  }
  // budget − spent across counted days in [sk, ek)
  function tally(sk, ek, c) {
    let budget = 0, spentCounted = 0, days = 0, onBudget = 0, spent = 0, noSpend = 0, notLogged = 0, nsKept = 0;
    for (let d = parseKey(sk); keyOf(d) < ek; d = addDays(d, 1)) {
      const k = keyOf(d), sp = c.byDay[k] || 0;
      spent += sp;
      if (missed(k, c)) notLogged++;
      if (!counted(k, c)) continue;
      const b = dayBudget(k);
      if (!sp && isNoSpend(k)) { noSpend++; nsKept += b; }
      budget += b; spentCounted += sp; days++;
      if (sp <= b) onBudget++;
    }
    return { budget, spent, spentCounted, diff: budget - spentCounted, days, onBudget, noSpend, notLogged, nsKept };
  }
  function streakOf(c) {
    let n = 0;
    for (let d = parseKey(c.today), i = 0; i < 3660; i++, d = addDays(d, -1)) {
      const k = keyOf(d);
      if (k < c.start) break;
      if (!logged(k, c)) { if (k === c.today) continue; break; }
      const b = dayBudget(k);
      if (b <= 0 || (c.byDay[k] || 0) > b) break;
      n++;
    }
    return n;
  }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ---------- writes (one at a time) ----------
  let chain = Promise.resolve();
  function enqueue(fn, onErr) {
    chain = chain.then(async () => {
      try { await fn(); }
      catch (e) {
        if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 800)); await fn(); }
        else throw e;
      }
    }).catch(e => {
      if (e && e.code === "invalid_argument") { readOnly = true; toast("You can view this ledger but not change it."); }
      else if (e && e.code === "quota_exceeded") setStatus("Storage is full. Export and clear old logs.", true);
      else setStatus("Couldn't save. Your phone storage may be full.", true);
    }).finally(onErr || (() => {}));
  }
  function saveMonth(mk) {
    if (!db) return;
    const list = (st.months[mk] || []).slice();
    pending[mk] = (pending[mk] || 0) + 1;
    enqueue(() => { const ref = db.doc("ledger/" + mk); return list.length ? ref.set({ month: mk, entries: list }) : ref.delete(); }, () => { pending[mk]--; });
  }
  function saveSettings() {
    applyTheme();
    if (!db) return;
    const s = clone(S);

    const isCurrent = c.today >= sk && c.today < ek;
    const word = p;

    // columns
    let cols = [];
    if (p === "year") {
      for (let m = 0; m < 12; m++) {
        const ms = new Date(s.getFullYear(), m, 1), me = new Date(s.getFullYear(), m + 1, 1);
        const t = tally(keyOf(ms), keyOf(me), c);
        cols.push({ label: fmtD(ms, { month: "narrow" }), full: fmtD(ms, { month: "long" }), spent: t.spent, budget: t.budget, counted: t.days > 0, now: c.today.slice(0, 7) === keyOf(ms).slice(0, 7), show: true, nsCount: t.noSpend, missCount: t.notLogged, spentCounted: t.spentCounted });
      }
    } else {
      let i = 0;
      for (let d = s; d < e; d = addDays(d, 1), i++) {
        const k = keyOf(d), cn = counted(k, c);
        const sp = c.byDay[k] || 0;
        cols.push({ label: p === "week" ? fmtD(d, { weekday: "short" }) : String(d.getDate()), full: fmtD(d, { weekday: "short", month: "short", day: "numeric" }), spent: sp, budget: cn ? dayBudget(k) : 0, counted: cn, now: k === c.today, show: p === "week" || i === 0 || (i + 1) % 5 === 0, key: k, ns: cn && !sp && isNoSpend(k), miss: missed(k, c), spentCounted: cn ? sp : 0 });
      }
    }
    const max = Math.max(0, ...cols.map(x => Math.max(x.spent, x.budget)));
    const top = max ? niceMax(max) : 0;
    const chart = (top ? `<div class="gl" style="bottom:calc(100% - 18px)"><span>${moneyShort(top)}</span></div><div class="gl" style="bottom:calc((100% - 18px) / 2)"><span>${moneyShort(top / 2)}</span></div>` : "") +
      cols.map(x => {
        const cls = (!x.spent ? "zero" : x.counted && x.budget > 0 ? (x.spent > x.budget ? "bad" : "good") : "") + (x.ns ? " ns" : "");
        const d = x.budget - (x.spentCounted ?? x.spent);
        const tip = x.ns ? `${x.full} · No-spend day${x.budget > 0 ? " · +" + money(x.budget) : ""}`
          : x.miss ? `${x.full} · Not logged`
          : `${x.full} · ${money(x.spent)}${x.counted && x.budget > 0 ? ` · ${d >= 0 ? "+" + money(d) : "−" + money(-d)}` : ""}`;
        return `<div class="col ${cls}" tabindex="0" aria-label="${esc(tip)}"><span class="tip">${esc(tip)}</span>${x.counted && x.budget > 0 && top ? `<div class="mk" style="bottom:${(x.budget / top * 100).toFixed(2)}%"></div>` : ""}<div class="b" style="height:${top ? (x.spent / top * 100).toFixed(2) : 0}%"></div></div>`;
      }).join("");

    // categories
    const by = {}; list.forEach(x => by[x.cat] = (by[x.cat] || 0) + homeCents(x));
    const cats = Object.entries(by).sort((a, z) => z[1] - a[1]);
    const catMax = cats.length ? cats[0][1] : 1;

    // day by day
    const dayRows = p === "year"
      ? cols.filter(x => x.counted || x.missCount).reverse().map(x => ({ name: x.full, spent: x.spent, diff: x.budget - x.spentCounted, hasB: x.budget > 0, counted: x.counted, extra: [x.nsCount ? `${x.nsCount} no-spend` : "", x.missCount ? `${x.missCount} not logged` : ""].filter(Boolean).join(" · ") }))
      : cols.filter(x => x.counted || x.miss).reverse().map(x => ({ name: x.full, spent: x.spent, diff: x.budget - x.spent, hasB: x.budget > 0, counted: x.counted, ns: x.ns, miss: x.miss, key: x.key }));
    const rowStatus = r => r.miss ? `<button type="button" class="chip soft btn" data-goto-day="${r.key}">Not logged</button>`
      : r.ns ? `<span class="chip good">No-spend${r.hasB ? " +" + money(r.diff) : ""}</span>`
      : r.counted && r.hasB ? diffChip(r.diff, true) : r.counted ? '<span class="sub">no budget</span>' : '<span class="sub">—</span>';

    let cmp = "&nbsp;";
    if (P.spent > 0) {
      const pct = Math.round((T.spent - P.spent) / P.spent * 100);
      cmp = pct === 0 ? `Same as last ${word}` : `<span class="${pct > 0 ? "up" : "down"}">${pct > 0 ? "▲" : "▼"} ${Math.abs(pct)}%</span> vs last ${word}`;
    }
    const hasB = T.budget > 0;
    const biggest = list.slice().sort((a, z) => homeCents(z) - homeCents(a)).slice(0, 5);
    const rb = buddyReport(T, c, word, list);

    $("view-reports").innerHTML = `
      <div class="seg" role="group" aria-label="Report period">
        ${["week", "month", "year"].map(x => `<button type="button" data-period="${x}" aria-pressed="${x === p}">${x[0].toUpperCase() + x.slice(1)}</button>`).join("")}
      </div>
      <div class="pnav">
        <button type="button" class="icon-btn" id="pPrev" aria-label="Previous ${word}">‹</button>
        <div class="plabel">${esc(periodLabel(p, s, e))}${isCurrent ? "" : `<button type="button" id="pNow">Back to this ${word}</button>`}</div>
        <button type="button" class="icon-btn" id="pNext" aria-label="Next ${word}" ${sk > c.today ? "disabled" : ""}>›</button>
      </div>
      <div class="kpis">
        <div class="kpi"><span class="lbl">Spent</span><span class="v">${money(T.spent)}</span><span class="hint">${cmp}</span></div>
        <div class="kpi"><span class="lbl">Budget</span><span class="v">${hasB ? money(T.budget) : "—"}</span><span class="hint">${T.days ? `${T.days} day${T.days === 1 ? "" : "s"} counted${isCurrent ? " so far" : ""}` : "No days counted yet"}</span></div>
        <div class="kpi ${hasB ? (T.diff >= 0 ? "good" : "bad") : ""}"><span class="lbl">${!hasB ? "Difference" : T.diff >= 0 ? "Saved" : "Over by"}</span><span class="v">${hasB ? money(Math.abs(T.diff)) : "—"}</span><span class="hint">Budget minus spending</span></div>
        <div class="kpi"><span class="lbl">Days on budget</span><span class="v">${hasB ? `${T.onBudget}/${T.days}` : "—"}</span><span class="hint">${hasB && T.days ? Math.round(T.onBudget / T.days * 100) + "% of days" : "Set a daily budget"}</span></div>
        <div class="kpi good"><span class="lbl">No-spend days</span><span class="v">${T.noSpend}</span><span class="hint">${T.noSpend ? (hasB ? `${money(T.nsKept)} kept` : "Nothing spent") : "Mark one from Today"}</span></div>
        <div class="kpi ${T.notLogged ? "bad" : ""}"><span class="lbl">Not logged</span><span class="v">${T.notLogged}</span><span class="hint">${T.notLogged ? "Not counted yet" : "All days accounted for"}</span></div>
      </div>
      <div class="hang">${buddyZone("reports", rb)}<div class="card">
        <div class="card-head"><h2>${p === "year" ? "Spending by month" : "Spending by day"}</h2><span class="sub">avg ${money(T.days ? Math.round(T.spentCounted / T.days) : 0)}/day</span></div>
        <div class="chart">${chart}</div>
        <div class="xl" aria-hidden="true">${cols.map(x => `<span>${x.show ? esc(x.label) : ""}</span>`).join("")}</div>
        <div class="legend"><span><i style="background:var(--mint-bar)"></i>Under budget</span><span><i style="background:var(--rose-bar)"></i>Over budget</span><span><i style="background:var(--mint-ink);border-radius:50%"></i>No-spend day</span><span><i class="dash"></i>Budget</span></div>
      </div></div>
      <div class="card">
        <div class="card-head"><h2>Where it went</h2><span class="sub">${list.length} log${list.length === 1 ? "" : "s"}</span></div>
        ${cats.length ? cats.map(([id, v]) => { const ct = catOf(id); return `<div class="catrow" style="--ch:${+ct.hue || 0}"><span class="bub">${esc(ct.emoji)}</span><span class="nm">${esc(ct.name)}</span><span class="amt">${money(v)}<small>${Math.round(v / T.spent * 100)}%</small></span><div class="track"><span style="width:${(v / catMax * 100).toFixed(1)}%"></span></div></div>`; }).join("") : `<p class="empty">No spending logged for this ${word}.</p>`}
      </div>
      <div class="card">
        <div class="card-head"><h2>${p === "year" ? "Month by month" : "Day by day"}</h2><span class="sub">budget − spent</span></div>
        ${dayRows.length ? dayRows.map(r => `<div class="drow"><span>${esc(r.name)}${r.extra ? `<br><span class="sub">${esc(r.extra)}</span>` : ""}</span><span class="amt">${r.miss || r.ns ? "" : money(r.spent)}</span>${rowStatus(r)}</div>`).join("") : `<p class="empty">No tracked days in this ${word} yet.</p>`}
      </div>
      <div class="card">
        <div class="card-head"><h2>Biggest spends</h2>${downloads && list.length ? `<button type="button" class="ghost" id="exportPeriod">Export CSV</button>` : ""}</div>
        <div class="logs">${biggest.length ? biggest.map(logRow).join("") : `<p class="empty">Nothing yet.</p>`}</div>
      </div>`;
    $("pPrev").onclick = () => { st.anchor = shiftPeriod(p, st.anchor, -1); render(); };
    $("pNext").onclick = () => { st.anchor = shiftPeriod(p, st.anchor, 1); render(); };
    const now = $("pNow"); if (now) now.onclick = () => { st.anchor = todayKey(); render(); };
    const ex = $("exportPeriod"); if (ex) ex.onclick = () => exportCSV(list, `petal-ledger-${p}-${sk}.csv`);
  }
  $("view-reports").addEventListener("click", e => {
    const b = e.target.closest("[data-period]"); if (b) { st.period = b.dataset.period; render(); return; }
    const g = e.target.closest("[data-goto-day]"); if (g) { st.day = g.dataset.gotoDay; st.view = "today"; render(); window.scrollTo({ top: 0 }); return; }
    const l = e.target.closest(".log"); if (l) openLog(l.dataset.id, l.dataset.mk);
  });

  // ---------- Logs ----------
  function renderLogs(c) {
    const mk = st.logsMonth, [y, m] = mk.split("-").map(Number);
    const q = st.logsQuery.trim().toLowerCase();
    const list = c.all.filter(x => x.date.slice(0, 7) === mk && (st.logsCat === "all" || x.cat === st.logsCat) &&
      (!q || (x.note || "").toLowerCase().includes(q) || catOf(x.cat).name.toLowerCase().includes(q)))
      .sort((a, z) => a.date === z.date ? (z.at || 0) - (a.at || 0) : (a.date < z.date ? 1 : -1));
    const groups = [];
    list.forEach(x => { const g = groups[groups.length - 1]; if (g && g.date === x.date) g.items.push(x); else groups.push({ date: x.date, items: [x] }); });
    if (st.logsCat === "all" && !q) {
      Object.keys(S.noSpend).filter(k => k.slice(0, 7) === mk && !c.byDay[k] && k <= c.today).forEach(k => groups.push({ date: k, items: [], ns: true }));
      groups.sort((a, z) => a.date < z.date ? 1 : -1);
    }
    const total = list.reduce((t, x) => t + homeCents(x), 0);
    const usedCats = [...new Set(c.all.map(x => x.cat))];
    const filterCats = [...activeCats().map(x => x.id), ...usedCats.filter(id => !activeCats().some(a => a.id === id))];
    const searchHad = document.activeElement && document.activeElement.id === "logSearch";
    $("view-logs").innerHTML = `
      <div class="pnav">
        <button type="button" class="icon-btn" id="lPrev" aria-label="Previous month">‹</button>
        <div class="plabel">${esc(fmtD(new Date(y, m - 1, 1), { month: "long", year: "numeric" }))}<span class="sub" style="display:block;font-family:var(--font-body)">${money(total)} · ${list.length} log${list.length === 1 ? "" : "s"}</span></div>
        <button type="button" class="icon-btn" id="lNext" aria-label="Next month">›</button>
      </div>
      <div class="search"><input id="logSearch" type="search" placeholder="Search notes or categories" value="${esc(st.logsQuery)}" aria-label="Search logs"></div>
      <div class="filters" role="group" aria-label="Filter by category">
        <button type="button" class="fchip" data-fcat="all" aria-pressed="${st.logsCat === "all"}">All</button>
        ${filterCats.map(id => { const ct = catOf(id); return `<button type="button" class="fchip" data-fcat="${esc(id)}" aria-pressed="${st.logsCat === id}">${esc(ct.emoji)} ${esc(ct.name)}</button>`; }).join("")}
      </div>
      <div class="card">
        ${groups.length ? groups.map(g => {
          const sp = c.byDay[g.date] || 0, b = dayBudget(g.date), cn = counted(g.date, c);
          if (g.ns) return `<div class="day-group"><div class="day-head"><span>${esc(fmtD(g.date, { weekday: "short", month: "short", day: "numeric" }))}</span><button type="button" class="chip good btn" data-goto-day="${g.date}">No-spend day${b > 0 && cn ? " +" + money(b) : ""}</button></div></div>`;
          return `<div class="day-group"><div class="day-head"><span>${esc(fmtD(g.date, { weekday: "short", month: "short", day: "numeric" }))} · ${money(sp)}</span>${cn ? diffChip(b - sp, b > 0) : ""}</div><div class="logs">${g.items.map(logRow).join("")}</div></div>`;
        }).join("") : `<p class="empty">No logs ${q || st.logsCat !== "all" ? "match this filter" : "this month"}.</p>`}
      </div>`;
    $("lPrev").onclick = () => { st.logsMonth = keyOf(new Date(y, m - 2, 1)).slice(0, 7); render(); };
    $("lNext").onclick = () => { st.logsMonth = keyOf(new Date(y, m, 1)).slice(0, 7); render(); };
    const s = $("logSearch");
    s.oninput = () => { st.logsQuery = s.value; render(); };
    if (searchHad) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  }
  $("view-logs").addEventListener("click", e => {
    const f = e.target.closest("[data-fcat]"); if (f) { st.logsCat = f.dataset.fcat; render(); return; }
    const g = e.target.closest("[data-goto-day]"); if (g) { st.day = g.dataset.gotoDay; st.view = "today"; render(); window.scrollTo({ top: 0 }); return; }
    const l = e.target.closest(".log"); if (l) openLog(l.dataset.id, l.dataset.mk);
  });

  // ---------- Settings ----------
  function renderSettings(c) {
    const ae = document.activeElement;
    if (ae && $("view-settings").contains(ae) && (ae.tagName === "INPUT")) return; // don't clobber typing
    const counts = {}; c.all.forEach(x => counts[x.cat] = (counts[x.cat] || 0) + 1);
    const rateCurs = Object.keys(S.rates).filter(k => k !== S.currency).sort();
    const addable = CURRENCIES.filter(k => k !== S.currency && !rateCurs.includes(k));
    const archived = S.categories.filter(x => x.archived);
    const hasEx = c.all.some(x => x.ex);
    $("view-settings").innerHTML = `
      <div class="card set-group">
        <h2>Look</h2>
        <div class="themes" role="group" aria-label="Colour theme">
          ${THEMES.map(([n, h]) => `<button type="button" class="swatch" data-theme-h="${h}" style="--sh:${h}" aria-pressed="${+S.theme === h}" aria-label="${n}" title="${n}"></button>`).join("")}
        </div>
      </div>
      <div class="card set-group">
        <div class="cat-item" style="grid-template-columns:64px minmax(0,1fr) auto">
          <span style="width:64px;height:64px;display:block;overflow:hidden">${buddySVG("happy")}</span>
          <span><span class="nm">Buddy</span><br><span class="sub">Comments on your spending and shares fun facts.</span></span>
          <button type="button" class="ghost" id="sBuddyToggle" aria-pressed="${S.buddy.on}">${S.buddy.on ? "On" : "Off"}</button>
        </div>
        <label class="field"><span>Buddy's name</span><input id="sBuddyName" maxlength="16" value="${esc(S.buddy.name)}" placeholder="Gus"></label>
      </div>
      <div class="card set-group">
        <h2>Budget</h2>
        <label class="field"><span>Minimum daily budget (${esc(S.currency)})</span><input id="sDaily" inputmode="decimal" placeholder="e.g. 50" value="${S.dailyBudgetCents ? S.dailyBudgetCents / 100 : ""}"></label>
        <p class="inline-note">Every day is compared against this. Change a single day's budget from the Today screen.</p>
        <div class="row">
          <label class="field"><span>Week starts on</span><select id="sWeek">${[[1, "Monday"], [0, "Sunday"], [6, "Saturday"]].map(([v, n]) => `<option value="${v}"${+S.weekStart === v ? " selected" : ""}>${n}</option>`).join("")}</select></label>
          <label class="field"><span>Tracking since</span><input type="date" id="sStart" value="${esc(S.startDate || c.start)}"></label>
        </div>
        <p class="inline-note">Days before this date aren't counted in budget totals.${S.startDate ? ` <button type="button" class="ghost" id="sStartReset" style="padding:3px 10px">Use first log</button>` : ""}</p>
      </div>
      <div class="card set-group">
        <h2>Currencies</h2>
        <label class="field"><span>Home currency (totals and budget)</span><select id="sCur">${CURRENCIES.map(k => `<option${k === S.currency ? " selected" : ""}>${k}</option>`).join("")}</select></label>
        ${st.pendingCur ? `<div class="inline-warn"><span>To convert your past logs and budget, how much is 1 ${esc(st.pendingCur)} in ${esc(S.currency)}?</span>
          <div class="rate-row" style="grid-template-columns:auto minmax(0,1fr) auto auto"><span>1 ${esc(st.pendingCur)} =</span><input id="sSwitchRate" inputmode="decimal" placeholder="rate"><span>${esc(S.currency)}</span><button type="button" class="ghost" id="sSwitchGo">Switch</button></div>
          <button type="button" class="ghost" id="sSwitchCancel" style="justify-self:start">Cancel</button></div>` : ""}
        <span class="lbl">Exchange rates</span>
        ${rateCurs.length ? rateCurs.map(k => `<div class="rate-row"><span>1 ${k} =</span><input data-rate="${k}" inputmode="decimal" value="${S.rates[k]}" aria-label="Rate for ${k}"><span>${esc(S.currency)}</span><button type="button" class="x" data-rate-del="${k}" aria-label="Remove ${k}">✕</button></div>`).join("") : `<p class="inline-note">Add a rate for each currency you spend in. You can also set it while logging.</p>`}
        <div class="add-rate">
          <select id="sAddCur" class="input" aria-label="Currency to add">${addable.map(k => `<option>${k}</option>`).join("")}</select>
          <input id="sAddRate" class="input" inputmode="decimal" placeholder="Value in ${esc(S.currency)}" aria-label="Rate">
          <button type="button" class="ghost" id="sAddGo">Add</button>
        </div>
      </div>
      <div class="card set-group">
        <div class="card-head" style="margin:0"><h2>Categories</h2><button type="button" class="ghost" id="sCatAdd">+ New</button></div>
        <div>${activeCats().map(x => `<div class="cat-item"><span class="bub" style="--ch:${+x.hue || 0}">${esc(x.emoji)}</span><span><span class="nm">${esc(x.name)}</span><br><span class="sub">${counts[x.id] || 0} log${counts[x.id] === 1 ? "" : "s"}</span></span><button type="button" class="ghost" data-cat-edit="${esc(x.id)}">Edit</button></div>`).join("")}</div>
        ${archived.length ? `<span class="lbl">Hidden</span>${archived.map(x => `<div class="cat-item"><span class="bub" style="--ch:${+x.hue || 0}">${esc(x.emoji)}</span><span class="nm">${esc(x.name)}</span><button type="button" class="ghost" data-cat-restore="${esc(x.id)}">Restore</button></div>`).join("")}` : ""}
      </div>
      <div class="card set-group">
        <h2>Your data</h2>
        <p class="inline-note">Your logs are saved only on this device. Make a backup now and then, so you keep them if you change or reset your phone.</p>
        <div class="btn-row">
          <button type="button" class="ghost" id="sBackup">Back up data</button>
          <button type="button" class="ghost" id="sRestore">Restore from backup</button>
          <input type="file" id="restoreFile" accept=".json,application/json" hidden>
        </div>
        ${st.restore ? `<div class="inline-warn"><span>Replace everything on this device with the backup from ${esc(st.restore.when)}? It has ${st.restore.count} log${st.restore.count === 1 ? "" : "s"}. This can't be undone.</span>
          <div class="btn-row"><button type="button" class="danger" id="sRestoreGo">Replace with backup</button><button type="button" class="secondary" id="sRestoreCancel">Cancel</button></div></div>` : ""}
        <div class="btn-row">
          ${downloads && c.all.length ? `<button type="button" class="ghost" id="sExport">Export all logs (CSV)</button>` : ""}
          ${hasEx ? `<button type="button" class="ghost" id="sClearEx">Clear example logs</button>` : ""}
        </div>
      </div>`;
  }
  const vs = $("view-settings");
  vs.addEventListener("click", e => {
    if (readOnly) return;
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.themeH) { S.theme = +t.dataset.themeH; saveSettings(); render(); return; }
    if (t.dataset.rateDel) { delete S.rates[t.dataset.rateDel]; saveSettings(); render(); return; }
    if (t.dataset.catEdit) { openCat(t.dataset.catEdit); return; }
    if (t.dataset.catRestore) { const ct = S.categories.find(x => x.id === t.dataset.catRestore); if (ct) { delete ct.archived; saveSettings(); render(); } return; }
    switch (t.id) {
      case "sStartReset": S.startDate = ""; saveSettings(); render(); break;
      case "sBuddyToggle": S.buddy = { ...S.buddy, on: !S.buddy.on }; saveSettings(); render(); toast(S.buddy.on ? `${S.buddy.name} is back!` : `${S.buddy.name} is taking a break`); break;
      case "sAddGo": {
        const k = $("sAddCur").value, r = parseNum($("sAddRate").value);
        if (!k || !(r > 0)) { toast("Enter how much 1 " + (k || "unit") + " is in " + S.currency); return; }
        S.rates[k] = tidyRate(r); saveSettings(); render(); toast(`Added 1 ${k} = ${S.rates[k]} ${S.currency}`); break;
      }
      case "sSwitchGo": { const r = parseNum($("sSwitchRate").value); if (!(r > 0)) { toast("Enter a rate above zero"); return; } switchHome(st.pendingCur, r); break; }
      case "sSwitchCancel": st.pendingCur = null; render(); break;
      case "sCatAdd": openCat(null); break;
      case "sExport": exportCSV(allEntries().sort((a, z) => a.date < z.date ? -1 : 1), "petal-ledger-all.csv"); break;
      case "sClearEx": clearExamples(); break;
      case "sBackup":
        saveFile({ filename: `petal-ledger-backup-${todayKey()}.json`, data: backupData(), type: "application/json" })
          .then(() => toast("Backup ready"), e => { if (!e || e.code !== "declined") toast("Couldn't create the backup"); });
        break;
      case "sRestore": $("restoreFile").click(); break;
      case "sRestoreCancel": st.restore = null; render(); break;
      case "sRestoreGo": applyRestore(st.restore.data); st.restore = null; render(); toast("Backup restored"); break;
    }
  });
  vs.addEventListener("change", e => {
    if (readOnly) return;
    const t = e.target;
    if (t.id === "sDaily") { const v = parseNum(t.value); S.dailyBudgetCents = v > 0 ? Math.round(v * 100) : 0; saveSettings(); t.blur(); render(); toast(S.dailyBudgetCents ? `Daily budget set to ${money(S.dailyBudgetCents)}` : "Daily budget cleared"); }
    else if (t.id === "sBuddyName") { S.buddy = { ...S.buddy, name: t.value.trim().slice(0, 16) || "Gus" }; saveSettings(); t.blur(); render(); toast(`Hi, I'm ${S.buddy.name}!`); }
    else if (t.id === "sWeek") { S.weekStart = +t.value; saveSettings(); render(); }
    else if (t.id === "sStart") { if (validKey(t.value)) { S.startDate = t.value; saveSettings(); t.blur(); render(); } }
    else if (t.id === "sCur") {
      const B = t.value; if (B === S.currency) return;
      if (S.rates[B]) switchHome(B, S.rates[B]);
      else if (!allEntries().length && !S.dailyBudgetCents) switchHome(B, 1);
      else { st.pendingCur = B; render(); }
    }
    else if (t.id === "restoreFile") {
      const f = t.files && t.files[0]; t.value = "";
      if (!f) return;
      f.text().then(text => {
        const data = parseBackup(text);
        const count = Object.values(data.ledger).reduce((n, d) => n + d.entries.length, 0);
        let when = f.name;
        try { const v = JSON.parse(text); if (v.exportedAt) when = fmtD(new Date(v.exportedAt), { month: "short", day: "numeric", year: "numeric" }); } catch {}
        st.restore = { data, count, when }; render();
      }).catch(() => toast("That file isn't a Petal Ledger backup"));
    }
    else if (t.dataset.rate) { const r = parseNum(t.value); if (r > 0) { S.rates[t.dataset.rate] = tidyRate(r); saveSettings(); } t.blur(); render(); }
  });
  // rB = value of 1 B in the old home currency
  function switchHome(B, rB) {
    const A = S.currency, nr = {};
    for (const [k, v] of Object.entries(S.rates)) if (k !== B && k !== A) nr[k] = tidyRate(v / rB);
    nr[A] = tidyRate(1 / rB);
    S.dailyBudgetCents = Math.round(S.dailyBudgetCents / rB);
    for (const k of Object.keys(S.dayBudgets)) S.dayBudgets[k] = Math.round(S.dayBudgets[k] / rB);
    S.rates = nr; S.currency = B; st.pendingCur = null;
    saveSettings(); render(); toast(`Totals now in ${B}`);
  }
  function clearExamples() {
    for (const mk of Object.keys(st.months)) {
      const before = st.months[mk], after = before.filter(x => !x.ex);
      if (after.length !== before.length) { st.months[mk] = after; saveMonth(mk); }
    }
    toast("Examples cleared. Start logging your own!"); render();
  }
  $("clearSamples").onclick = clearExamples;

  async function exportCSV(rows, filename) {
    if (!downloads) return;
    const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const csv = ["Date,Category,Amount,Currency,Original amount,Original currency,Note",
      ...rows.map(x => [x.date, q(catOf(x.cat).name), (homeCents(x) / 100).toFixed(2), S.currency, ((x.amt ?? x.cents) / 100).toFixed(2), x.cur || S.currency, q(x.note)].join(","))].join("\n");
    try { await downloads.save({ filename, data: csv }); toast("Export ready"); }
    catch (e) { if (!e || e.code !== "declined") toast("Couldn't export the file"); }
  }

  // ---------- sheets ----------
  const openSheets = [];
  function showSheet(el) { el.hidden = false; $("scrim").hidden = false; if (!openSheets.includes(el)) openSheets.push(el); const f = el.querySelector("input:not([disabled]):not([type=date])"); if (f) setTimeout(() => f.focus({ preventScroll: true }), 60); }
  function closeSheet(el) { el.hidden = true; const i = openSheets.indexOf(el); if (i >= 0) openSheets.splice(i, 1); if (!openSheets.length) $("scrim").hidden = true; }
  $("scrim").onclick = () => { const top = openSheets[openSheets.length - 1]; if (top) closeSheet(top); };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && openSheets.length) closeSheet(openSheets[openSheets.length - 1]); });
  document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => closeSheet(b.closest(".sheet")));

  // Log sheet
  function fillCurSelect(sel, value) {
    const list = [S.currency, ...Object.keys(S.rates).filter(k => k !== S.currency).sort(), ...CURRENCIES.filter(k => k !== S.currency && !(k in S.rates))];
    sel.innerHTML = list.map(k => `<option${k === value ? " selected" : ""}>${k}</option>`).join("");
  }
  function renderFormCats() {
    const cats = activeCats();
    if (!cats.some(x => x.id === st.formCat)) {
      const cur = st.edit && S.categories.find(x => x.id === st.formCat);
      if (!cur) st.formCat = cats[0] ? cats[0].id : null;
    }
    const extra = st.formCat && !cats.some(x => x.id === st.formCat) ? [catOf(st.formCat)] : [];
    $("fCats").innerHTML = [...cats, ...extra].map(x => `<button type="button" class="catbtn" data-fc="${esc(x.id)}" aria-pressed="${x.id === st.formCat}" style="--ch:${+x.hue || 0}"><span class="e">${esc(x.emoji)}</span><span class="t">${esc(x.name)}</span></button>`).join("") +
      `<button type="button" class="catbtn new" data-fc-new><span class="e">+</span><span class="t">New</span></button>`;
  }
  $("fCats").addEventListener("click", e => {
    if (e.target.closest("[data-fc-new]")) { st.catFromLog = true; openCat(null); return; }
    const b = e.target.closest("[data-fc]"); if (!b) return;
    st.formCat = b.dataset.fc; renderFormCats();
  });
  function updateRate() {
    const cur = $("fCur").value, foreign = cur !== S.currency;
    $("fRateLine").hidden = !foreign;
    if (!foreign) return;
    $("fRateFrom").textContent = `1 ${cur} =`; $("fRateTo").textContent = S.currency;
    const r = parseNum($("fRate").value), a = parseNum($("fAmt").value);
    $("fConv").textContent = r > 0 && a > 0 ? "≈ " + money(Math.round(a * 100 * r)) : "";
  }
  $("fCur").onchange = () => { const cur = $("fCur").value; $("fRate").value = S.rates[cur] || ""; updateRate(); if (cur !== S.currency && !S.rates[cur]) $("fRate").focus(); };
  $("fRate").oninput = updateRate; $("fAmt").oninput = updateRate;

  function openLog(id, mk) {
    if (readOnly) { toast("You can view this ledger but not change it."); return; }
    const e = id ? (st.months[mk] || []).find(x => x.id === id) : null;
    st.edit = e ? { id, mk } : null;
    const cur = e ? (e.cur || S.currency) : (st.lastCur && (st.lastCur === S.currency || S.rates[st.lastCur]) ? st.lastCur : S.currency);
    fillCurSelect($("fCur"), cur);
    $("fAmt").value = e ? ((e.amt ?? e.cents) / 100).toString() : "";
    $("fRate").value = e && cur !== S.currency ? (S.rates[cur] || (e.amt ? tidyRate(e.cents / e.amt) : "")) : (S.rates[cur] || "");
    $("fDate").value = e ? e.date : (st.view === "today" ? st.day : todayKey());
    $("fNote").value = e ? (e.note || "") : "";
    st.formCat = e ? e.cat : (st.formCat || (activeCats()[0] || {}).id);
    $("logTitle").textContent = e ? "Edit log" : "Log spending";
    $("fSave").textContent = e ? "Save changes" : "Save log";
    $("fEditBtns").hidden = !e; disarm($("fDel"), "Delete");
    $("fMsg").textContent = "";
    renderFormCats(); updateRate(); showSheet($("logSheet"));
  }
  $("fab").onclick = () => openLog(null);
  function readForm() {
    const msg = $("fMsg");
    const a = parseNum($("fAmt").value), amt = Math.round(a * 100);
    if (!(amt > 0)) { msg.textContent = "Enter an amount above zero."; $("fAmt").focus(); return null; }
    const date = $("fDate").value; if (!validKey(date)) { msg.textContent = "Pick a date."; return null; }
    if (!st.formCat) { msg.textContent = "Pick a category."; return null; }
    const cur = $("fCur").value; let cents = amt;
    if (cur !== S.currency) {
      const r = parseNum($("fRate").value);
      if (!(r > 0)) { msg.textContent = `Enter how much 1 ${cur} is in ${S.currency}.`; $("fRate").focus(); return null; }
      if (S.rates[cur] !== tidyRate(r)) { S.rates[cur] = tidyRate(r); saveSettings(); }
      cents = Math.round(amt * r);
    }
    return { date, amt, cur, cents, home: S.currency, cat: st.formCat, note: $("fNote").value.trim().slice(0, 80) };
  }
  $("logSheet").addEventListener("submit", ev => {
    ev.preventDefault();
    const f = readForm(); if (!f) return;
    const mk = f.date.slice(0, 7);
    if (st.edit) {
      const { id, mk: oldMk } = st.edit;
      const old = (st.months[oldMk] || []).find(x => x.id === id) || {};
      const entry = { id, at: old.at || Date.now(), ...f };
      st.months[oldMk] = (st.months[oldMk] || []).filter(x => x.id !== id);
      st.months[mk] = [...(st.months[mk] || []), entry];
      if (oldMk !== mk) saveMonth(oldMk);
      saveMonth(mk); toast("Log updated");
    } else {
      st.months[mk] = [...(st.months[mk] || []), { id: newId(), at: Date.now(), ...f }];
      saveMonth(mk);
      const b = dayBudget(f.date), left = b - ((context().byDay[f.date]) || 0);
      toast(b > 0 ? (left >= 0 ? `Logged · ${money(left)} left for the day` : `Logged · ${money(-left)} over for the day`) : `Logged ${money(f.cents)}`);
    }
    st.lastCur = f.cur;
    if (S.noSpend[f.date]) { delete S.noSpend[f.date]; saveSettings(); }
    closeSheet($("logSheet")); render();
  });
  $("fDup").onclick = () => {
    const f = readForm(); if (!f) return;
    f.date = todayKey(); const mk = f.date.slice(0, 7);
    st.months[mk] = [...(st.months[mk] || []), { id: newId(), at: Date.now(), ...f }];
    if (S.noSpend[f.date]) { delete S.noSpend[f.date]; saveSettings(); }
    saveMonth(mk); closeSheet($("logSheet")); toast("Logged again for today"); render();
  };
  let armT = null;
  function disarm(b, label) { b.classList.remove("armed"); b.textContent = label; }
  function armOr(b, label, fn) {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Tap again to confirm"; clearTimeout(armT); armT = setTimeout(() => disarm(b, label), 3500); return; }
    disarm(b, label); fn();
  }
  $("fDel").onclick = () => armOr($("fDel"), "Delete", () => {
    const { id, mk } = st.edit;
    st.months[mk] = (st.months[mk] || []).filter(x => x.id !== id);
    saveMonth(mk); closeSheet($("logSheet")); toast("Log deleted"); render();
  });

  // Budget sheet
  function openBudget(k) {
    if (readOnly) return;
    st.budgetDay = k;
    const custom = Object.prototype.hasOwnProperty.call(S.dayBudgets, k);
    fillCurSelect($("bCurShow"), S.currency);
    $("bAmt").value = dayBudget(k) ? dayBudget(k) / 100 : "";
    $("budgetTitle").textContent = "Budget for " + fmtD(k, { weekday: "short", month: "short", day: "numeric" });
    $("bNote").textContent = S.dailyBudgetCents ? `Your default is ${money(S.dailyBudgetCents)} a day.${custom ? " This day has its own budget." : ""}` : "Set the minimum you plan to spend each day. Each day's spending is compared to it.";
    $("bReset").hidden = !custom; $("bMsg").textContent = "";
    showSheet($("budgetSheet"));
  }
  function budgetValue() { const v = parseNum($("bAmt").value); const c = Math.round(v * 100); if (!(c > 0)) { $("bMsg").textContent = "Enter an amount above zero."; return null; } return c; }
  $("budgetSheet").addEventListener("submit", ev => { ev.preventDefault(); const c = budgetValue(); if (c == null) return;
    if (!S.dailyBudgetCents) S.dailyBudgetCents = c; else if (c === S.dailyBudgetCents) delete S.dayBudgets[st.budgetDay]; else S.dayBudgets[st.budgetDay] = c;
    saveSettings(); closeSheet($("budgetSheet")); toast("Budget saved"); render(); });
  $("bSaveDefault").onclick = () => { const c = budgetValue(); if (c == null) return; S.dailyBudgetCents = c; delete S.dayBudgets[st.budgetDay]; saveSettings(); closeSheet($("budgetSheet")); toast(`Daily budget set to ${money(c)}`); render(); };
  $("bReset").onclick = () => { delete S.dayBudgets[st.budgetDay]; saveSettings(); closeSheet($("budgetSheet")); toast("Back to your daily default"); render(); };

  // Category sheet
  function openCat(id) {
    if (readOnly) return;
    const ct = id ? S.categories.find(x => x.id === id) : null;
    st.catEdit = ct ? id : null;
    st.catHue = ct ? +ct.hue : HUES[Math.floor(Math.random() * HUES.length)];
    $("cEmoji").value = ct ? ct.emoji : ""; $("cName").value = ct ? ct.name : "";
    $("catTitle").textContent = ct ? "Edit category" : "New category";
    $("cMsg").textContent = "";
    const used = ct && allEntries().some(x => x.cat === id);
    $("cEditBtns").hidden = !ct; disarm($("cDel"), used ? "Hide category" : "Delete category");
    $("cDel").dataset.used = used ? "1" : "";
    renderHues(); showSheet($("catSheet"));
  }
  function renderHues() { $("cHues").innerHTML = HUES.map(h => `<button type="button" class="hue" data-hue="${h}" style="--ch:${h}" aria-pressed="${h === st.catHue}" aria-label="Colour ${h}"></button>`).join(""); }
  $("cHues").addEventListener("click", e => { const b = e.target.closest("[data-hue]"); if (b) { st.catHue = +b.dataset.hue; renderHues(); } });
  $("catSheet").addEventListener("submit", ev => {
    ev.preventDefault();
    const name = $("cName").value.trim(), emoji = $("cEmoji").value.trim() || "🌷";
    if (!name) { $("cMsg").textContent = "Give the category a name."; $("cName").focus(); return; }
    let id = st.catEdit;
    if (id) Object.assign(S.categories.find(x => x.id === id), { name, emoji, hue: st.catHue });
    else { id = "c" + newId(); S.categories.push({ id, name, emoji, hue: st.catHue }); }
    saveSettings(); closeSheet($("catSheet"));
    if (st.catFromLog && !$("logSheet").hidden) { st.formCat = id; renderFormCats(); }
    st.catFromLog = false; toast("Category saved"); render();
  });
  $("cDel").onclick = () => {
    const used = !!$("cDel").dataset.used, label = used ? "Hide category" : "Delete category";
    armOr($("cDel"), label, () => {
      const id = st.catEdit;
      if (used) { const ct = S.categories.find(x => x.id === id); if (ct) ct.archived = true; }
      else S.categories = S.categories.filter(x => x.id !== id);
      saveSettings(); closeSheet($("catSheet")); toast(used ? "Hidden. Old logs keep it." : "Category deleted"); render();
    });
  };

  // ---------- navigation ----------
  const TITLES = { today: "My day", reports: "Reports", logs: "All logs", settings: "Settings" };
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
    st.view = t.dataset.view;
    if (st.view !== "settings") st.pendingCur = null;
    render(); window.scrollTo({ top: 0 });
  });

  function render() {
    const c = context();
    for (const v of ["today", "reports", "logs", "settings"]) $("view-" + v).hidden = v !== st.view;
    document.querySelectorAll(".tab").forEach(t => { if (t.dataset.view === st.view) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); });
    $("viewTitle").textContent = TITLES[st.view];
    $("fab").hidden = st.view === "settings" || readOnly;
    $("sampleBanner").hidden = readOnly || !c.all.some(x => x.ex);
    if (st.view === "today") renderToday(c);
    else if (st.view === "reports") renderReports(c);
    else if (st.view === "logs") renderLogs(c);
    else renderSettings(c);
  }


  // ---------- on-device storage (replaces the claude.ai database) ----------
  const STORE_KEY = "petal-ledger-v1";
  function loadStore() {
    try {
      const v = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (v && typeof v === "object") return { ledger: v.ledger && typeof v.ledger === "object" ? v.ledger : {}, settings: v.settings || null };
    } catch {}
    return { ledger: {}, settings: null };
  }
  let store = loadStore();
  const listeners = { ledger: new Set(), settings: new Set() };
  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
    catch { throw { code: "quota_exceeded" }; }
  }
  const meta = { fromCache: false, hasPendingWrites: false };
  const snapLedger = () => ({ docs: Object.keys(store.ledger).sort().map(id => ({ id, exists: true, data: () => store.ledger[id] })), metadata: meta });
  const snapSettings = () => ({ id: "main", exists: !!store.settings, data: () => store.settings || undefined, metadata: meta });
  function emit(kind) { for (const fn of listeners[kind]) { try { fn(kind === "ledger" ? snapLedger() : snapSettings()); } catch (e) { console.error(e); } } }
  function createLocalDB() {
    return {
      doc(path) {
        const [col, id] = path.split("/");
        const kind = col === "ledger" ? "ledger" : "settings";
        return {
          async set(data) { const c = clone(data); if (kind === "ledger") store.ledger[id] = c; else store.settings = c; persist(); emit(kind); },
          async delete() { if (kind === "ledger") delete store.ledger[id]; else store.settings = null; persist(); emit(kind); },
          onSnapshot(next) { listeners.settings.add(next); queueMicrotask(() => next(snapSettings())); return () => listeners.settings.delete(next); },
        };
      },
      collection() {
        return { onSnapshot(next) { listeners.ledger.add(next); queueMicrotask(() => next(snapLedger())); return () => listeners.ledger.delete(next); } };
      },
    };
  }
  addEventListener("storage", e => { if (e.key === STORE_KEY) { store = loadStore(); emit("ledger"); emit("settings"); } });

  // Share sheet on iPhone (Save to Files, AirDrop…); a normal download elsewhere.
  async function saveFile({ filename, data, type = "text/csv" }) {
    const file = new File([data], filename, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e && e.name === "AbortError") throw { code: "declined" }; }
    }
    const url = URL.createObjectURL(file);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  // ---------- backup & restore ----------
  function backupData() {
    return JSON.stringify({ app: "petal-ledger", version: 1, exportedAt: new Date().toISOString(), ledger: store.ledger, settings: store.settings || clone(S) }, null, 1);
  }
  function parseBackup(text) {
    const v = JSON.parse(text);
    if (!v || typeof v !== "object" || !v.ledger || typeof v.ledger !== "object") throw new Error("not a backup");
    const ledger = {};
    for (const [mk, doc] of Object.entries(v.ledger)) {
      if (/^\d{4}-\d{2}$/.test(mk) && doc && Array.isArray(doc.entries)) ledger[mk] = { month: mk, entries: doc.entries.filter(e => e && e.id && validKey(e.date)) };
    }
    return { ledger, settings: v.settings && typeof v.settings === "object" ? v.settings : null };
  }
  function applyRestore(data) {
    store = { ledger: data.ledger, settings: data.settings };
    persist();
    if (data.settings) S = normSettings(data.settings);
    applyTheme(); emit("ledger"); emit("settings");
  }

  // ---------- boot ----------
  function normSettings(v) {
    const s = clone(DEFAULTS);
    if (typeof v.currency === "string") s.currency = v.currency;
    s.dailyBudgetCents = Number(v.dailyBudgetCents) || 0;
    if (v.dayBudgets && typeof v.dayBudgets === "object") s.dayBudgets = { ...v.dayBudgets };
    if (v.buddy && typeof v.buddy === "object") s.buddy = { on: v.buddy.on !== false, name: typeof v.buddy.name === "string" && v.buddy.name.trim() ? v.buddy.name.trim().slice(0, 16) : "Gus" };
    if (v.noSpend && typeof v.noSpend === "object") for (const k of Object.keys(v.noSpend)) if (validKey(k) && v.noSpend[k]) s.noSpend[k] = true;
    if (Array.isArray(v.categories) && v.categories.length) s.categories = v.categories.filter(x => x && x.id && x.name).map(x => ({ ...x }));
    if (v.rates && typeof v.rates === "object") for (const [k, r] of Object.entries(v.rates)) if (+r > 0) s.rates[k] = +r;
    if ([0, 1, 6].includes(+v.weekStart)) s.weekStart = +v.weekStart;
    if (validKey(v.startDate)) s.startDate = v.startDate;
    if (Number.isFinite(+v.theme)) s.theme = +v.theme;
    return s;
  }
  applyTheme(); render();

  (async () => {
    db = createLocalDB(); downloads = { save: saveFile };
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
    let loaded = false;
    const timer = setTimeout(() => { if (!loaded) setStatus("Can't reach your saved logs yet.", true); }, 10000);
    db.collection("ledger").onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { const v = d.data(); if (v && Array.isArray(v.entries)) next[d.id] = v.entries; });
      for (const mk of Object.keys(pending)) if (pending[mk] > 0) { if (st.months[mk]) next[mk] = st.months[mk]; else delete next[mk]; }
      st.months = next;
      if (!snap.metadata.fromCache && !loaded) { loaded = true; clearTimeout(timer); setStatus("Saved on this device"); }
      render();
    }, err => { clearTimeout(timer); setStatus(err && err.code === "revoked" ? "Access ended." : "Couldn't load saved logs.", true); });
    db.doc("settings/main").onSnapshot(snap => {
      if (pendingSettings > 0 || !snap.exists) return;
      S = normSettings(snap.data()); applyTheme(); render();
    }, () => {});
  })();

  // roll over at midnight
  let lastDay = todayKey();
  setInterval(() => { const t = todayKey(); if (t !== lastDay) { if (st.day === lastDay) st.day = t; lastDay = t; render(); } }, 60000);
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
